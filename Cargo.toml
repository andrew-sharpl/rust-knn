[package]
name = "rust-knn"
version = "0.1.0"
edition = "2024"
authors = ["Andrew <me@andrewsharp.dev>"]
description = "A brute-force k-nearest neighbors classifier in Rust with Python bindings"
license = "MIT"
repository = "https://github.com/andrew-sharpl/rust-knn"

[lib]
name = "knn"
crate-type = ["rlib", "cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
ndarray = "0.16"
rayon = "1.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench_knn"
harness = false
