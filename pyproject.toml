[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "rust-knn"
requires-python = ">=3.9"
readme = "README.md"
description = "A k-nearest neighbors classifier with brute-force and KD-tree search, with Python bindings via PyO3."
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[dependency-groups]
dev = ["pytest>=8", "numpy>=1.26", "scikit-learn>=1.3"]

[tool.maturin]
features = ["python"]
